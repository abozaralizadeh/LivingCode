[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livingcode"
version = "0.4.0"
description = "A library that lets a throwaway sample project improve itself, with a hardcoded safety net that contains no AI."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
livingcode = "livingcode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
